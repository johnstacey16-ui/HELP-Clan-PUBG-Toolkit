name: Toolkit UI smoke checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify toolkit panels, scripts and navigation
        run: node --test tests/*.test.cjs
