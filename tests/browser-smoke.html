<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>HELP Toolkit Browser Smoke</title></head>
<body data-smoke-status="pending">
<pre id="result">Running real browser checks…</pre>
<iframe id="app-frame" title="Toolkit under test" src="../index.html" width="390" height="780"></iframe>
<script>
(function(){
  'use strict';
  const output=document.getElementById('result'),frame=document.getElementById('app-frame');
  const eq=(actual,expected,message)=>{if(actual!==expected)throw new Error(message+' (expected '+expected+', got '+actual+')');};
  const check=(yes,message)=>{if(!yes)throw new Error(message);};
  const change=(el,val,type='change')=>{check(!!el,'Missing input');el.value=val;el.dispatchEvent(new Event(type,{bubbles:true}));};
  frame.addEventListener('load',()=>{
    setTimeout(()=>{
      try {
        const child=frame.contentDocument;
        check(!!child && !!child.getElementById('panel-sensitivity'),'Loaded real index.html');
        const get=id=>{const element=child.getElementById(id);check(!!element,'Missing '+id);return element};
        const text=id=>get(id).textContent.trim();
        const open=id=>{
          const button=child.querySelector('[data-open-panel="'+id+'"]');
          check(!!button,'Missing navigation '+id);
          button.click();
          check(get(id).classList.contains('active'),'Panel did not open '+id);
          eq(child.querySelectorAll('.hub-main.active').length,1,'Exactly one visible panel');
        };
        check(get('panel-sensitivity').classList.contains('active'),'Scope matcher must open first');
        check(text('px_speed')!=='–' && text('px_speed')!=='','Scope result initially calculates');
        eq(child.querySelectorAll('#px_table tbody tr').length,7,'Seven scope conversions');

        // Sidebar and numbered navigation follow the user-requested position.
        const sidebarIds=[...child.querySelectorAll('#app-toolnav [data-open-panel]')].map(b=>b.dataset.openPanel);
        eq(sidebarIds.join(','),['panel-sensitivity','panel-combat','panel-hit-zone','panel-range','panel-ttk','panel-recoil2','panel-attach','panel-backpack'].join(','),'Hit Zone Explorer appears immediately above Effective Range');
        // Mobile drawer and all eight navigable tools.
        get('mobile-nav-toggle').click();
        check(child.body.classList.contains('sidebar-open'),'Mobile drawer opens');
        for(const id of ['panel-combat','panel-sensitivity','panel-hit-zone','panel-range','panel-ttk','panel-recoil2','panel-attach','panel-backpack'])open(id);
        check(!child.body.classList.contains('sidebar-open'),'Navigation closes drawer');

        // All thirteen labels render without tapping; helmet and vest work independently.
        open('panel-hit-zone');
        eq(get('active-tool-index').getAttribute('aria-label'),'Tool 3 of 8','Hit Zone Explorer is tool 03 of 08');
        eq(get('hz_weapon').value,'M416','Hit-zone weapon initializes to M416');
        eq(child.querySelectorAll('#hz_body [data-hit-zone]').length,13,'All body-zone shapes exist');
        eq(child.querySelectorAll('#hz_body [data-hz-value]').length,13,'All hit-zone values shown simultaneously');
        const hzValue=id=>child.querySelector('[data-hz-value="'+id+'"]').textContent.trim();
        eq(hzValue('chest'),'44.0','M416 chest unarmoured at 0m');
        eq(hzValue('head'),'94.0','M416 head unarmoured at 0m');
        const bareThigh=hzValue('thigh');
        change(get('hz_helmet'),'3');
        eq(hzValue('head'),'42.3','Level 3 helmet reduces head');
        eq(hzValue('chest'),'44.0','Helmet does not change chest');
        change(get('hz_vest'),'2');
        eq(hzValue('chest'),'26.4','Level 2 vest reduces chest');
        eq(hzValue('head'),'42.3','Vest does not change head');
        eq(hzValue('thigh'),bareThigh,'Vest cannot protect thigh');
        change(get('hz_mode'),'htk');
        eq(hzValue('chest'),'4 hits','HTK display labels hits unambiguously');
        check(text('hz_status').includes('100 HP'),'HTK explains the 100 HP single-zone assumption');
        eq(child.querySelector('[data-hit-zone="chest"]').getAttribute('aria-label'),'Chest: 4 hits','Keyboard label describes hits instead of a multiplier');
        change(get('hz_mode'),'heatmap');
        check(!!child.querySelector('[data-hit-zone="chest"]').style.fill,'Heatmap colours computed zone');
        change(get('hz_weapon'),'DBS');
        eq(hzValue('chest'),'No data','Pellet shotgun must not imply whole-shell damage');
        check(text('hz_status').includes('per pellet'),'Shotgun missing-data warning remains');
        const idealOption=child.querySelector('#hz_mode option[value="ideal-shells"]');
        check(!idealOption.disabled,'Theoretical minimum-shell mode only opens for pellet shotguns');
        change(get('hz_mode'),'ideal-shells');
        eq(hzValue('chest'),'1 shell*','DBS lower-bound count is rendered as shells, not damage');
        check(text('hz_status').includes('THEORETICAL MINIMUM'),'Ideal-shell warning prominent');
        check(text('hz_detail').includes('THEORETICAL LOWER BOUND'),'Ideal-shell detail explicitly avoids claiming a real hit count');
        change(get('hz_weapon'),'S12K');
        change(get('hz_distance'),'25');
        eq(hzValue('chest'),'2 shells*','S12K 25m level 2 vest idealized shell floor');
        eq(hzValue('thigh'),'2 shells*','S12K theoretical result available for unarmoured limb');
        change(get('hz_weapon'),'O12');
        eq(get('hz_mode').value,'damage','Switching to slug automatically restores real-damage mode');
        check(idealOption.disabled,'Theoretical shell mode is disabled for slug weapons');
        eq(get('hz_distance').value,'25','O12 preserves a shared published 25m checkpoint');
        check(hzValue('chest')!=='No data','O12 slug is supported at its recorded 25m');
        change(get('hz_weapon'),'DBS');
        change(get('hz_distance'),'0');
        change(get('hz_weapon'),'O12');
        eq(get('hz_distance').value,'2','O12 starts at 2m when previous 0m is unsupported');
        check(hzValue('chest')!=='No data','O12 slug is supported at its first recorded 2m');
        change(get('hz_weapon'),'M416');
        change(get('hz_distance'),'100');
        check(hzValue('chest')!=='No data','Published 100m damage available');
        get('hz_body').querySelector('[data-hit-zone="calf"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));
        check(text('hz_detail').includes('Calf'),'Optional region detail responds to clicks');
        eq(get('hz_body').querySelector('[data-hit-zone="calf"]').getAttribute('aria-pressed'),'true','Pointer-selected zone exposes state');
        eq(get('hz_body').querySelector('[data-hit-zone="chest"]').getAttribute('aria-pressed'),'false','Other zones are not selected');
        const keyboardZone=get('hz_body').querySelector('[data-hit-zone="head"]');
        keyboardZone.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
        check(text('hz_detail').includes('Head:'),'Keyboard Enter opens the optional zone breakdown');
        check(keyboardZone.getAttribute('aria-label').includes('Head:'),'Keyboard target announces zone and value');
        eq(keyboardZone.getAttribute('aria-controls'),'hz_detail','Keyboard targets connect to the detail panel');
        eq(keyboardZone.getAttribute('aria-pressed'),'true','Keyboard-selected zone exposes state');
        eq(get('hz_body').querySelector('[data-hit-zone="calf"]').getAttribute('aria-pressed'),'false','Keyboard selection clears old zone');
        eq(child.querySelectorAll('#hz_rows tr').length,13,'Accessible table includes all body regions');
        check(!!child.querySelector('#panel-hit-zone table caption'),'Table has a descriptive accessibility caption');
        eq(child.querySelectorAll('#panel-hit-zone thead th[scope="col"]').length,3,'Result headings declare column scope');
        // All 45 combat weapons must render 13 consistent readouts and safe
        // no-data states without leaking NaN, Infinity, or per-pellet damage.
        const hitZoneWeaponNames=[...get('hz_weapon').options].map(o=>o.value).filter(Boolean);
        eq(hitZoneWeaponNames.length,45,'Hit-zone selector includes all 45 toolkit weapons');
        const pelletNames=new Set(['DBS','S686','S12K','Sawn-off']);
        change(get('hz_mode'),'damage');
        for(const gun of hitZoneWeaponNames){
          change(get('hz_weapon'),gun);
          const hasCheckpoint=!get('hz_distance').disabled;
          const isPellet=pelletNames.has(gun);
          eq(child.querySelectorAll('#hz_rows tr').length,13,gun+' all-zone table updates');
          const chips=[...child.querySelectorAll('#hz_body [data-hz-value]')].map(el=>el.textContent.trim());
          eq(chips.length,13,gun+' all regions have simultaneous values');
          for(const chip of chips){
            check(chip==='No data'||/^\d+(?:\.\d+)?$/.test(chip),
              gun+' must show measured damage or No data (got '+chip+')');
          }
          if(isPellet){
            check(chips.every(v=>v==='No data'),gun+' actual shell totals remain unknown');
            check(!idealOption.disabled,gun+' theoretical mode enabled');
            if(hasCheckpoint){
              change(get('hz_mode'),'ideal-shells');
              const idealChips=[...child.querySelectorAll('#hz_body [data-hz-value]')].map(el=>el.textContent.trim());
              check(idealChips.every(v=>/^[1-9]\d* shells?\*$/.test(v)),
                gun+' all thirteen zones show a labelled theoretical lower bound');
              change(get('hz_mode'),'damage');
            }
          }else{
            check(idealOption.disabled,gun+' theoretical pellet mode unavailable');
            check(chips.every(v=>hasCheckpoint ? /^\d+(?:\.\d+)?$/.test(v) : v==='No data'),
              gun+' must not show inconsistent source status between zones');
          }
        }
        change(get('hz_weapon'),'M416');
        change(get('hz_distance'),'0');
        change(get('hz_helmet'),'0');
        change(get('hz_vest'),'0');
        eq(hzValue('chest'),'44.0','Weapon sweep leaves selector usable at the unarmoured 0m checkpoint');
        // Return to unchanged core calculator regression path.
        open('panel-range');
        change(get('rg_weapon'),'S686');
        check(text('rg_htk')!=='No data','Shotgun minimum shells available');
        check(text('rg_approxNote').includes('all'),'Shotgun pellet limitation shown');
        change(get('rg_weapon'),'M416');
        check(text('rg_dmg')!=='No data','Rifle checkpoint damage appears');

        open('panel-ttk');
        check(text('tk_htk')!=='No data','TTK initializes');
        change(get('tk_weapon'),'M416');
        check(text('tk_pure')!=='No data','Weapon switch updates TTK');

        open('panel-recoil2');
        change(get('rc_weapon'),'RPD');
        check(text('rc_missing').includes('No data'),'Exact recoil remains explicitly unknown');

        open('panel-attach');
        change(get('at_weapon'),'MK14 EBR');
        change(get('at_mag'),'extended');
        eq(text('at_capNew'),'22','Mk14 DMR/SR extended rounds');
        change(get('at_mag'),'extended_ar');
        eq(text('at_capNew'),'20','Mk14 AR/DMR extended rounds');
        change(get('at_weapon'),'SLR');
        check(Array.from(get('at_mag').options).some(o=>o.value==='extended_ar'),'SLR supports second magazine family');
        change(get('at_mag'),'extended_ar');
        eq(text('at_capNew'),'20','SLR AR magazine rounds');
        change(get('at_weapon'),'ACE 32');
        eq(get('at_mag').value,'none','Incompatible dual magazine must reset');
        change(get('at_mag'),'extended');
        eq(text('at_capNew'),'42','ACE Extended rounds, cross-source mapping');
        change(get('at_mag'),'extquick');
        eq(text('at_capNew'),'40','ACE Extended QuickDraw rounds');
        change(get('at_weapon'),'SVD Dragunov');
        change(get('at_mag'),'extended');
        eq(text('at_capNew'),'No data','Dragunov unresolved magazine-family capacity');

        // Exercise every weapon in the actual dropdown, including unknown
        // magazines. No numeric output may be NaN or a fractional round.
        const gunNames=Array.from(get('at_weapon').options).map(o=>o.value).filter(Boolean);
        eq(gunNames.length,45,'All 45 weapons selectable in Attachments');
        for(const gun of gunNames){
          change(get('at_weapon'),gun);
          const magazine=get('at_mag');
          if(magazine.disabled){
            eq(magazine.value,'none',gun+' has no magazine attachment slot');
            continue;
          }
          const optionIds=Array.from(magazine.options).map(o=>o.value);
          check(optionIds.includes('extended') && optionIds.includes('extquick'),
            gun+' must offer known magazine item types');
          let maxCap=null,quickCap=null;
          for(const id of ['extended','extquick']){
            change(magazine,id);
            const raw=text('at_capNew');
            check(raw==='No data'||/^[1-9][0-9]*$/.test(raw),
              gun+' '+id+' must show a valid integer or No data (got '+raw+')');
            if(raw!=='No data' && id==='extended') maxCap=Number(raw);
            if(raw!=='No data' && id==='extquick') quickCap=Number(raw);
          }
          if(maxCap!==null&&quickCap!==null)
            check(quickCap<=maxCap,gun+' Extended QuickDraw cannot exceed Extended');
        }
        change(get('at_weapon'),'SVD Dragunov');
        for(const kind of ['extended','extquick','extended_ar','extquick_ar']){
          change(get('at_mag'),kind);
          eq(text('at_capNew'),'No data','Unresolved Dragunov '+kind+' stays unknown');
        }
        change(get('at_weapon'),'ACE 32');
        change(get('at_mag'),'extended');
        eq(text('at_capNew'),'42','ACE Extended maximum capacity');
        change(get('at_mag'),'extquick');
        eq(text('at_capNew'),'40','ACE Extended QuickDraw capacity');

        // For each gun, any missing recoil parameter still reads No data;
        // never manufacture a shot-by-shot curve from the key count.
        open('panel-recoil2');
        for(const gun of gunNames){
          change(get('rc_weapon'),gun);
          check(/No verified [0-9]+-shot recoil curve/.test(text('rc_chart')),
            gun+' must not invent a recoil trace');
        }

        open('panel-backpack');
        change(get('bp_type'),'jammer');
        change(get('bp_level'),'1');
        change(get('bp_vest'),'no');
        eq(text('bp_cap'),'220','Jammer level 1 without vest');
        change(get('bp_vest'),'yes');
        eq(text('bp_cap'),'270','Jammer level 1 with vest');
        const ammo=child.querySelector('input[data-bp="556"]');
        change(ammo,'100','input');
        eq(text('bp_used'),'50.0','100 rounds 5.56 inventory weight');
        eq(text('bp_rem'),'220.0','Remaining carry capacity');
        get('bp_clear').click();
        eq(text('bp_used'),'0.0','Backpack Clear button');

        document.body.dataset.smokeStatus='pass';
        output.textContent='PASS: seven tools, navigation, sensitivity, range/TTK/recoil, magazines, and backpack';
      }catch(e){
        document.body.dataset.smokeStatus='fail';
        output.textContent='FAIL: '+(e && e.stack || e);
      }
    },100);
  });
  setTimeout(()=>{
    if(document.body.dataset.smokeStatus==='pending'){
      document.body.dataset.smokeStatus='fail';
      output.textContent='FAIL: Toolkit iframe never became ready';
    }
  },7000);
})();
</script>
</body>
</html>
